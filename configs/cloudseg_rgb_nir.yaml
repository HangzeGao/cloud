# CloudSense-Net RGB+NIR 四通道配置文件
# 使用业界最优 NIR 生成算法，从 RGB 生成伪 NIR 通道
#
# NIR (近红外) 在云分割中的优势:
# - 云在 NIR 波段具有更高的反射率，与地表/植被形成更强对比
# - 利用植被指数 (NDVI) 思想增强云边界检测
# - 参考 Sentinel-2、Landsat 等卫星的多光谱特性

# ==================== 模型架构配置 ====================
model:
  name: "CloudSenseNet-RGBNIR"
  num_classes: 2  # 云/背景 二分类

  # ------------------ 编码器选择 ------------------
  encoder:
    type: "efficientnet"  # 推荐 EfficientNet 或 ConvNeXt
    enabled: true
    
    efficientnet:
      model_name: "efficientnet_b3"
      pretrained: true
    
    convnext:
      model_name: "convnext_tiny"
      pretrained: true
      drop_path_rate: 0.1

  # ------------------ 语义增强模块 ------------------
  semantic_enhancement:
    enabled: false
    vocabulary_size: 2
    patch_size: 16
    embed_dim: 768
    merge_stage: 0

  # ------------------ 特征融合层 ------------------
  fusion:
    enabled: true
    type: "fpn"
    
    fpn:
      out_channels: 256
      num_levels: 4

  # ------------------ 解码器选择 ------------------
  decoder:
    type: "segformer"
    enabled: true
    
    segformer:
      embed_dim: 256

  # ------------------ 辅助头 ------------------
  auxiliary_head:
    enabled: false
    loss_weight: 0.4

# ==================== 训练配置 ====================
training:
  batch_size: 4  # 4通道比3通道占用更多显存，适当减小
  num_epochs: 100
  num_workers: 4
  
  optimizer:
    type: "AdamW"
    lr: 1e-4
    weight_decay: 1e-4
    backbone_lr_mult: 0.1
  
  scheduler:
    type: "cosine_warmup"
    warmup_epochs: 5
    T_0: 10
    T_mult: 2

  loss:
    types: ["dice", "bce"]
    weights: [0.5, 0.5]
    
  augmentation:
    enabled: true
    random_crop_size: [512, 512]
    horizontal_flip: 0.5
    vertical_flip: 0.5
    brightness: 0.2
    contrast: 0.2
    gaussian_noise: 0.01
    # NIR 会在数据增强后自动从增强后的 RGB 生成

# ==================== 数据配置 (含 NIR 配置) ====================
data:
  train_data_path: "../Data/RICE2"
  val_data_path: "../Data/HRC_WHU"
  test_data_path: "../Data/HRC_WHU"
  
  # ------------------ NIR 通道配置 ------------------
  # 是否启用 NIR 通道 (RGB -> RGB+NIR)
  use_nir: true
  
  # NIR 生成算法:
  # - 'physical': 基于云光谱物理特性 (推荐)
  #   公式: NIR = 0.7*R + 0.25*G + 0.05*B
  #   原理: 云在 NIR (0.76-0.90μm) 具有高反射率
  #
  # - 'vegetation': 基于植被指数启发
  #   公式: NIR ≈ (R + G) / 2 + 0.3 * |G - R|
  #   原理: 利用绿波段与红波段的差异估算近红外反射率
  #
  # - 'enhanced': 增强型，结合局部对比度
  #   公式: NIR = 0.65*R + 0.30*G + 0.05*B + variance_enhancement
  #   原理: 增加云的边缘检测能力
  #
  # - 'weighted': 简单加权组合
  #   公式: NIR = 0.65*R + 0.25*G + 0.10*B
  #   原理: 平衡加权，适合一般场景
  nir_method: "physical"
  
  # NIR 增益系数: 云在 NIR 反射率通常比 RGB 高 10-30%
  # 推荐范围: 1.0 - 1.3
  nir_gain: 1.1
  
  # 推理配置
  inference:
    mode: "sliding_window"
    window_size: 512
    stride: 256
    scales: [0.5, 1.0, 1.5]

# ==================== 其他配置 ====================
experiment:
  seed: 42
  save_dir: "./experiments"
  log_interval: 10
  val_interval: 1
  save_best_only: true
