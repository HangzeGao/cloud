# CloudSense-Net Apple MPS (Metal Performance Shaders) 优化配置
# 专为 Apple Silicon (M1/M2/M3) 优化的配置
# 支持多数据集混合训练

# ==================== 模型架构配置 ====================
model:
  name: "CloudSenseNet_MPS"
  num_classes: 2

  # ------------------ 编码器选择 ------------------
  # 推荐 ConvNeXt 或 EfficientNet，在MPS上效率更高
  encoder:
    type: "efficientnet"  # convnext/efficientnet/resnet (swin在MPS上较慢)
    enabled: true
    convnext:
      model_name: "efficientnet_b3"
      pretrained: true
      drop_path_rate: 0.1

  # ------------------ 语义增强模块 ------------------
  semantic_enhancement:
    enabled: true
    vocabulary_size: 2
    patch_size: 16
    embed_dim: 768
    merge_stage: 0

  # ------------------ 特征融合层 ------------------
  fusion:
    enabled: true
    type: "fpn"  # FPN在MPS上效率较好
    fpn:
      out_channels: 256
      num_levels: 4

  # ------------------ 解码器选择 ------------------
  decoder:
    type: "segformer"  # SegFormer轻量高效，适合MPS
    enabled: true
    segformer:
      embed_dim: 256

  # ------------------ 辅助头 ------------------
  auxiliary_head:
    enabled: false  # MPS显存有限，建议禁用
    loss_weight: 0.4

# ==================== MPS优化训练配置 ====================
training:
  # Apple Silicon统一内存架构，但建议batch_size不要太大
  batch_size: 8  # M2建议4-8，根据内存调整
  num_epochs: 5
  num_workers: 1  # MPS支持多线程数据加载

  optimizer:
    type: "AdamW"
    lr: 1e-4
    weight_decay: 1e-4
    backbone_lr_mult: 0.1

  scheduler:
    type: "cosine_warmup"
    warmup_epochs: 5
    T_0: 10
    T_mult: 2

  loss:
    types: ["dice", "bce"]
    weights: [0.5, 0.5]

  augmentation:
    enabled: true
    random_crop_size: [512, 512]
    horizontal_flip: 0.5
    vertical_flip: 0.5
    brightness: 0.2
    contrast: 0.2
    gaussian_noise: 0.01

# ==================== 多数据集混合训练配置 ====================
data:
  # 是否启用多数据集混合训练模式
  multi_dataset: true
  
  # 多数据集列表（所有数据集均用作训练）
  # 支持不同类型数据集混合：
  # - 标准 3 通道 8bit: RICE2, HRC_WHU
  # - 原生 4 通道 13bit: cloud_cover_detection
  datasets:
    - name: "HRC_WHU"
      path: "../Data/HRC_WHU"
      type: "standard"      # 标准 3 通道 8bit
      bit_depth: 8            # 位宽: 8bit
      channels: 3             # 通道: RGB
      weight: 1.0           # 采样权重
      use_all_bands: false    # 从RGB生成伪NIR
      
    - name: "RICE2"
      path: "../Data/RICE2"
      type: "standard"      # 标准 3 通道 8bit
      bit_depth: 8            # 位宽: 8bit
      channels: 3             # 通道: RGB
      weight: 1.0
      use_all_bands: false    # 从RGB生成伪NIR
      
    - name: "cloud_cover_detection"
      path: "../Data/cloud_cover_detection"
      type: "cloud_cover"   # 原生 4 通道 13bit
      bit_depth: 13           # 位宽: 13bit（非标准16bit）
      channels: 4             # 通道: RGB+NIR
      weight: 0.8           # 稍微降低权重以平衡样本数
      use_all_bands: true   # 使用原生 NIR 通道
  
  # 数据统一配置（所有数据集将被统一到这些设置）
  # 通道设置
  target_channels: 4      # 目标通道数：4 (RGB+NIR)
  use_nir: true           # 统一使用 NIR
  
  # NIR 生成算法（用于从 RGB 生成 NIR 的数据集）
  nir_method: "physical"
  nir_gain: 1.1
  
  # 位宽统一设置
  target_bit_depth: 16    # 目标位深：16bit
  
  # 业界标准的图像归一化方法配置
  normalization:
    # 归一化方法选择:
    # - 'max': 最大值归一化 (简单直接，但容易受异常值影响)
    # - 'percentile': 基于分位数的归一化 (业界推荐，鲁棒性强)
    #    使用 1%-99% 分位数范围，去除极值影响
    # - 'zscore': Z-score 标准化 (均值为0，方差为1)
    # - 'histeq': 直方图均衡化 (增强对比度)
    # - 'clahe': 对比度受限的自适应直方图均衡化 (业界标准，局部增强)
    #    特别适合非均匀光照的云层图像
    # - 'sensor': 传感器特定定标 (需要具体传感器参数)
    method: "percentile"    # 推荐使用 percentile
    
    # 分位数归一化参数 (当 method='percentile' 时有效)
    lower_percentile: 1.0   # 下分位数 (去除暗部异常，如阴影、噪声)
    upper_percentile: 99.0  # 上分位数 (去除亮部异常，如眩光、过曝)
    
    # CLAHE 参数 (当 method='clahe' 时有效)
    clip_limit: 2.0         # 对比度限制 (防止过度增强)
    tile_grid_size: [8, 8]  # 网格大小 (将图像分为 8x8 块局部处理)
  
  # Val/Test 采样配置（从混合训练集中采样）
  val_test_split:
    enabled: true
    val_ratio: 0.15        # 15% 用作验证
    test_ratio: 0.10       # 10% 用作测试
    train_ratio: 0.75      # 75% 用作训练
    seed: 42               # 随机种子保证可复现
    stratify: true         # 分层采样（保持各数据集比例）
  
  # 可选：使用固定目录（如果不从训练集采样）
  # val_data_path: "../Data/HRC_WHU"
  # test_data_path: "../Data/HRC_WHU"

  inference:
    mode: "sliding_window"
    window_size: 512
    stride: 256
    scales: [0.5, 1.0, 1.5]

# ==================== 其他配置 ====================
experiment:
  seed: 42
  save_dir: "./experiments"
  log_interval: 10
  val_interval: 1
  save_best_only: true

# ==================== MPS特定提示 ====================
# 使用说明:
# 1. 训练: python3 train.py --config configs/cloudseg_mps_optimized.yaml --device mps
# 2. 评估: python3 eval.py --checkpoint experiments_mps/best_model.pth --device mps ...
# 3. 推理: python3 inference.py --checkpoint experiments_mps/best_model.pth --device mps ...
#
# MPS优化建议:
# - 使用 --device auto 自动检测MPS
# - batch_size根据Mac内存调整: M2(8GB)->4, M2 Pro(16GB)->8, M2 Max(32GB)->16
# - 避免使用Swin Transformer（在MPS上性能不佳）
# - 推荐使用ConvNeXt或EfficientNet
#
# 多数据集混合训练说明:
# - 所有数据集统一为 4 通道 16bit
# - 3通道数据集自动生成 NIR
# - 16bit 数据集自动归一化
# - val/test 从训练集分层采样
