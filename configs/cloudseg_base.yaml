# CloudSense-Net 基础配置
# 适用于通用环境，使用统一数据集

# ==================== 模型架构配置 ====================
model:
  name: "CloudSenseNet"
  num_classes: 2

  # 编码器选择
  encoder:
    type: "efficientnet"
    enabled: true
    efficientnet:
      model_name: "efficientnet_b3"
      pretrained: true

  # 语义增强模块
  semantic_enhancement:
    enabled: true
    vocabulary_size: 2
    patch_size: 16
    embed_dim: 768
    merge_stage: 0

  # 特征融合层
  fusion:
    enabled: true
    type: "fpn"
    fpn:
      out_channels: 256
      num_levels: 4

  # 解码器选择
  decoder:
    type: "segformer"
    enabled: true
    segformer:
      embed_dim: 256

  # 辅助头
  auxiliary_head:
    enabled: false
    loss_weight: 0.4

# ==================== 训练配置 ====================
training:
  batch_size: 8
  num_epochs: 50
  num_workers: 4
  
  # 早停耐心值 (0 = 禁用早停, >0 = 连续N个epoch无改善则停止)
  patience: 10

  optimizer:
    type: "AdamW"
    lr: 1e-4
    weight_decay: 1e-4
    backbone_lr_mult: 0.1

  scheduler:
    type: "cosine_warmup"
    warmup_epochs: 5
    T_0: 10
    T_mult: 2

  loss:
    types: ["dice", "bce"]
    weights: [0.5, 0.5]

  augmentation:
    enabled: true
    random_crop_size: [512, 512]
    horizontal_flip: 0.5
    vertical_flip: 0.5
    brightness: 0.2
    contrast: 0.2
    gaussian_noise: 0.01

# ==================== 数据集配置 ====================
data:
  # 统一数据集目录
  unified_data_dir: "./Data/Unified_Cloud_Dataset"
  
  # 数据集列表
  datasets:
    - name: "hrcwhu"
    - name: "rice2"
    - name: "oncloudn"
    - name: "cloud38"
    - name: "cloud95"
  
  # 数据统一配置
  # use_nir: 是否使用 NIR 通道 (true=4通道 RGB+NIR, false=3通道 RGB)
  use_nir: true
  
  # normalize: 归一化方法 ('percentile', 'minmax', 'standard', 'reflectance', 'none')
  normalize: 'percentile'
  
  # Val/Test 分割配置
  val_test_split:
    enabled: true
    train_ratio: 0.75
    val_ratio: 0.15
    test_ratio: 0.10
    seed: 42
    stratify: true

# ==================== 推理配置 ====================
inference:
  mode: "sliding_window"
  window_size: 512
  stride: 256
  scales: [0.5, 1.0, 1.5]

# ==================== 实验配置 ====================
experiment:
  seed: 42
  save_dir: "./experiments"
  log_interval: 10
  val_interval: 1
  save_best_only: true
