# CloudSense-Net MPS (Apple Silicon) 优化配置
# 专为 Apple Silicon (M1/M2/M3) 优化的配置

# ==================== 模型架构配置 ====================
model:
  name: "CloudSenseNet_MPS"
  num_classes: 2

  # 编码器选择 - MPS 上推荐 EfficientNet
  encoder:
    type: "efficientnet"
    enabled: true
    efficientnet:
      model_name: "efficientnet_b3"
      pretrained: true
      drop_path_rate: 0.1

  # 语义增强模块
  semantic_enhancement:
    enabled: true
    vocabulary_size: 2
    patch_size: 16
    embed_dim: 768
    merge_stage: 0

  # 特征融合层
  fusion:
    enabled: true
    type: "fpn"
    fpn:
      out_channels: 256
      num_levels: 4

  # 解码器选择 - SegFormer 轻量高效
  decoder:
    type: "segformer"
    enabled: true
    segformer:
      embed_dim: 256

  # 辅助头 - MPS 显存有限，建议禁用
  auxiliary_head:
    enabled: false
    loss_weight: 0.4

# ==================== MPS 优化训练配置 ====================
training:
  # Apple Silicon 统一内存架构，但建议 batch_size 适中
  # M1/M2 (8GB): batch_size=4
  # M2 Pro (16GB): batch_size=8
  # M2 Max (32GB): batch_size=16
  batch_size: 8
  num_epochs: 50
  num_workers: 2  # MPS 推荐较少 workers
  
  # MPS 混合精度支持有限，建议禁用
  amp:
    enabled: false

  optimizer:
    type: "AdamW"
    lr: 1e-4
    weight_decay: 1e-4
    backbone_lr_mult: 0.1

  scheduler:
    type: "cosine_warmup"
    warmup_epochs: 5
    T_0: 10
    T_mult: 2

  loss:
    types: ["dice", "bce"]
    weights: [0.5, 0.5]

  augmentation:
    enabled: true
    random_crop_size: [512, 512]
    horizontal_flip: 0.5
    vertical_flip: 0.5
    brightness: 0.2
    contrast: 0.2
    gaussian_noise: 0.01

# ==================== MPS 优化数据集配置 ====================
data:
  multi_dataset: true
  unified_data_dir: "../Data/Unified_Cloud_Dataset"
  
  # MPS 建议从少量数据集开始
  datasets:
    - name: "hrcwhu"
    - name: "rice2"
    - name: "oncloudn"
  
  target_channels: 4
  target_bit_depth: 16
  use_nir: true
  
  nir_method: "physical"
  nir_gain: 1.1
  
  normalization:
    method: "percentile"
    lower_percentile: 1.0
    upper_percentile: 99.0
  
  val_test_split:
    enabled: true
    train_ratio: 0.75
    val_ratio: 0.15
    test_ratio: 0.10
    seed: 42
    stratify: true

# ==================== 推理配置 ====================
inference:
  mode: "sliding_window"
  window_size: 512
  stride: 256
  scales: [0.5, 1.0, 1.5]

# ==================== 实验配置 ====================
experiment:
  seed: 42
  save_dir: "./experiments_mps"
  log_interval: 10
  val_interval: 1
  save_best_only: true

# ==================== MPS 特定提示 ====================
# 使用说明:
# 1. 训练: python3 train.py --config configs/cloudseg_mps.yaml --device mps
# 2. 评估: python3 eval.py --checkpoint experiments_mps/best_model.pth --device mps
# 3. 推理: python3 inference.py --checkpoint experiments_mps/best_model.pth --device mps
#
# MPS 优化建议:
# - 使用 --device auto 自动检测 MPS
# - batch_size 根据 Mac 内存调整: M2(8GB)->4, M2 Pro(16GB)->8, M2 Max(32GB)->16
# - 避免使用 Swin Transformer（在 MPS 上性能不佳）
# - 推荐使用 ConvNeXt 或 EfficientNet
